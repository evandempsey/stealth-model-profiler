[project]
name = "stealth-model-profiler"
version = "0.1.0"
description = "Identify candidate model families behind OpenRouter stealth listings using short answers and tokenizer fingerprints"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Evan Dempsey"}]
dependencies = ["httpx>=0.27", "tokenizers>=0.20", "tiktoken>=0.7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/evandempsey/stealth-model-profiler"
Issues = "https://github.com/evandempsey/stealth-model-profiler/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
stealth-model-profiler = "stealth_model_profiler.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stealth_model_profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"stealth_model_profiler.family" = ["enrollment.json", "sieve_refs.json"]
